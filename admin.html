<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PicShare Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><header><div><p class="eyebrow">PICS HARE CONTROL</p><h1>PicShare Admin</h1><p class="muted">Manage community posts</p></div><a href="./index.html">Back to PicShare</a></header><section id="status" class="panel">Checking administrator access…</section><section id="loginPanel" class="panel" hidden><h2>Administrator sign in</h2><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn">Sign in</button><p id="loginError" class="error"></p></section><section id="dashboard" hidden><div class="panel"><span>Total posts</span><strong id="postCount">—</strong></div><div class="panel"><div class="row"><h2>All posts</h2><button id="refreshBtn" class="secondary">Refresh</button></div><div id="posts"></div></div><button id="logoutBtn" class="secondary">Sign out</button></section></main><script type="module" src="admin.js"></script></body></html>
